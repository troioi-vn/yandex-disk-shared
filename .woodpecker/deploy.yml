when:
  - event: [push, manual]
    branch: main

depends_on:
  - build

labels:
  ci-role: yandex-runtime

steps:
  - name: deploy
    image: docker:28-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY_AUTH_USERNAME:
        from_secret: REGISTRY_AUTH_USERNAME
      REGISTRY_AUTH_PASSWORD:
        from_secret: REGISTRY_AUTH_PASSWORD
      REGISTRY_HOST:
        from_secret: REGISTRY_HOST
      IMAGE_REPO:
        from_secret: IMAGE_REPO
      YANDEX_DEPLOY_PATH:
        from_secret: YANDEX_DEPLOY_PATH
      YANDEX_HOST_DATA_DIR:
        from_secret: YANDEX_HOST_DATA_DIR
    commands:
      - 'test -n "$${REGISTRY_AUTH_USERNAME}"'
      - 'test -n "$${REGISTRY_AUTH_PASSWORD}"'
      - 'test -n "$${REGISTRY_HOST}"'
      - 'test -n "$${IMAGE_REPO}"'
      - 'test -n "$${YANDEX_DEPLOY_PATH}"'
      - 'test -n "$${YANDEX_HOST_DATA_DIR}"'
      - 'printf "%s\n" "$${REGISTRY_AUTH_PASSWORD}" | docker login "$${REGISTRY_HOST}" -u "$${REGISTRY_AUTH_USERNAME}" --password-stdin'
      - 'export IMAGE="$${IMAGE_REPO}:$${CI_COMMIT_SHA}"'
      - |
        printf '%s\n' \
          "YANDEX_IMAGE=$${IMAGE}" \
          'YANDEX_CONTAINER_NAME=yandex-disk-shared' \
          'YANDEX_UID=1000' \
          'YANDEX_GID=1000' \
          "YANDEX_HOST_CONFIG_DIR=$${YANDEX_DEPLOY_PATH}/config" \
          "YANDEX_HOST_DATA_DIR=$${YANDEX_HOST_DATA_DIR}" \
          'YANDEX_PROXY=' \
          'YANDEX_EXCLUDE_DIRS=' \
          'YANDEX_READ_ONLY=false' \
          'YANDEX_OVERWRITE=false' \
          > .env.deploy
      - 'docker pull "$${IMAGE}"'
      - 'docker run --rm -v "$${YANDEX_DEPLOY_PATH}:/target" alpine:3.22 sh -lc "mkdir -p /target/config /target/data && chown -R 1000:1000 /target/config /target/data"'
      - 'docker run --rm -i -v "$${YANDEX_DEPLOY_PATH}:/target" alpine:3.22 sh -lc "cat > /target/docker-compose.yml" < docker-compose.yml'
      - 'docker run --rm -i -v "$${YANDEX_DEPLOY_PATH}:/target" alpine:3.22 sh -lc "cat > /target/docker-entrypoint.sh && chmod 755 /target/docker-entrypoint.sh" < docker-entrypoint.sh'
      - 'docker run --rm -i -v "$${YANDEX_DEPLOY_PATH}:/target" alpine:3.22 sh -lc "cat > /target/.env && chmod 600 /target/.env" < .env.deploy'
      - 'docker compose --env-file .env.deploy -f docker-compose.yml up -d --force-recreate'
      - 'timeout 120 sh -c "until [ \"$(docker inspect -f ''{{.State.Running}}'' yandex-disk-shared 2>/dev/null)\" = \"true\" ]; do sleep 3; done"'
      - 'docker compose --env-file .env.deploy -f docker-compose.yml ps'
      - 'docker logs --tail 40 yandex-disk-shared'
      - 'rm -f .env.deploy'
